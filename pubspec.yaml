name: business_onboarding
description: "FastPay merchant onboarding app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  go_router: ^17.2.3
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.3.4
  flutter_secure_storage: ^10.3.4
  flutter_form_builder: ^10.2.0
  form_builder_validators: ^11.2.0
  phone_numbers_parser: ^9.0.29
  image_picker: ^1.2.2
  file_picker: ^11.0.3
  flutter_image_compress: ^2.5.1
  permission_handler: ^12.0.1  # 13.x needs AGP 9 / Kotlin 2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  build_runner: ^2.7.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true
  generate: true
